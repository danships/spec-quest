name: Server image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  release-check:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.release.outputs.image }}
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        name: Check server version
        shell: bash
        run: |
          version=$(node -p "require('./packages/server/package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/server version $version" >&2
            exit 1
          fi

          repository=${GITHUB_REPOSITORY,,}
          echo "image=ghcr.io/${repository}-server" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          previous_tag=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" --match 'v[0-9]*' 2>/dev/null || true)
          if [[ -z "$previous_tag" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_version=$(git show "$previous_tag:packages/server/package.json" 2>/dev/null | node -e \
            "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => console.log(JSON.parse(input).version))" \
            || true)
          if [[ "$previous_version" == "$version" ]]; then
            echo "Server version $version is unchanged since $previous_tag; skipping image." >&2
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: release-check
    if: needs.release-check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          tags: |
            ${{ needs.release-check.outputs.image }}:${{ needs.release-check.outputs.version }}
            ${{ needs.release-check.outputs.image }}:latest
